<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predict Student Score</title>
</head>
<body>
    <h2>Predict Student Score Based on Study Hours</h2>

        <button type="submit">Predict Score</button>
    </form>
</body>
</html>
